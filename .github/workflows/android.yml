name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      
    - name: download missing files
      run: |
       cd ./app/src/main/assets

       wget -O proton-9.0-arm64ec.txz https://gitlab.com/winlator3/winlator-extra/-/raw/main/proton/proton-9.0-arm64ec.txz
       wget -O proton-9.0-x86_64.txz https://gitlab.com/winlator3/winlator-extra/-/raw/main/proton/proton-9.0-x86_64.txz
       wget -O imagefs.txz.00 https://gitlab.com/winlator3/winlator-extra/-/raw/main/imagefs/imagefs.txz.00
       wget -O imagefs.txz.01 https://gitlab.com/winlator3/winlator-extra/-/raw/main/imagefs/imagefs.txz.01
       wget -O imagefs.txz.02 https://gitlab.com/winlator3/winlator-extra/-/raw/main/imagefs/imagefs.txz.02
       wget -O imagefs.txz.03 https://gitlab.com/winlator3/winlator-extra/-/raw/main/imagefs/imagefs.txz.03
       cat imagefs.txz.* > imagefs.txz

    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install dependencies
      run: |
       sudo apt-get update
       sudo apt-get install -y libgl1 libglu1-mesa libc6 lib32z1
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
       name: Winlator APK
       path: app/build/outputs/apk/debug/app-debug.apk